name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4; version comes from "packageManager" in package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm
      # Also downloads Electron and rebuilds better-sqlite3 (postinstall).
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      # Plain Node: better-sqlite3 is an N-API module, the same binary loads in Node and Electron.
      - run: pnpm test
      - run: pnpm build

  # End to end: the built app against the fake site, with a real extension host and a real player.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm
      # Also builds `ma-ext` (the CLI's prepare script), which the tests use to build the example extension.
      - run: pnpm install --frozen-lockfile
      # Ubuntu 24.04 runners restrict unprivileged user namespaces (AppArmor), which Chromium's sandbox needs.
      - name: Allow user namespaces for the Chromium sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: xvfb-run -a pnpm e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/desktop/playwright-report
            apps/desktop/test-results
          retention-days: 7
