name: Release

# Builds the installers on each OS (native modules are per OS, docs/PRD.md R12) and publishes them to GitHub
# Releases, where electron-updater finds them. Pushing a tag `v<version>` publishes; a manual run only builds
# and keeps the files as workflow artifacts, unless "publish" is ticked. A tag with a prerelease part
# (`v0.1.0-beta.1`) becomes a GitHub pre-release: that is the beta channel.
#
# Publishing is guarded twice. The commit has to be on `main` and its CI run has to have passed (`prepare`).
# The release is created as a draft, which electron-updater does not see; the last job makes it public only
# after every build, including the AppImage smoke test, went green. A red job leaves a draft to delete.
#
# Not verified yet: the repository did not exist when this was written (milestone 3h). Only the Linux
# AppImage was built and smoke-tested, locally. NSIS, the portable .exe, deb, rpm, dmg and publishing are untested.
# Several targets in one electron-builder run are uploaded by the same `--publish always`. Check after the first run
# that latest.yml / latest-linux.yml point at the NSIS installer and the AppImage, not at the portable .exe or the
# deb/rpm (docs/packaging/README.md).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to GitHub Releases (the release is named after the version in package.json)
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # create the release and upload its files
  actions: read # look up the CI run of the commit being released

jobs:
  prepare:
    name: prepare
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      publish: ${{ steps.meta.outputs.publish }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # the main check below needs the history
      - name: Read the version
        id: meta
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          tag="v$version"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match apps/desktop/package.json ($tag)"
            exit 1
          fi
          publish=false
          if [[ "$GITHUB_REF_TYPE" == "tag" || "$PUBLISH_INPUT" == "true" ]]; then publish=true; fi
          prerelease=false
          if [[ "$version" == *-* ]]; then prerelease=true; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
        env:
          PUBLISH_INPUT: ${{ inputs.publish }}
      # Only a commit that is on main and went green in CI may be released, whether by tag or by a manual run.
      - name: Check the commit is on main and CI passed
        if: steps.meta.outputs.publish == 'true'
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not on main; merge it first, then tag the merge commit"
            exit 1
          fi
          passed=$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --status success --json databaseId --jq length)
          if [[ "$passed" == "0" ]]; then
            echo "::error::no successful CI run for $GITHUB_SHA"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
      # Created once here: three jobs creating the same release at the same time would race.
      # A draft: electron-updater only sees it once the `publish` job below has made it public.
      - name: Create the release
        if: steps.meta.outputs.publish == 'true'
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then exit 0; fi
          flags=(--draft --title "$TAG" --generate-notes)
          if [[ "$PRERELEASE" == "true" ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" "${flags[@]}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}

  build:
    name: build (${{ matrix.name }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # one OS failing must not stop the others from publishing
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            args: --linux AppImage deb rpm
            cache: |
              ~/.cache/electron
              ~/.cache/electron-builder
          - name: windows
            os: windows-latest
            args: --win nsis portable
            cache: |
              ~\AppData\Local\electron\Cache
              ~\AppData\Local\electron-builder\Cache
          - name: macos
            os: macos-latest
            # One runner builds both arches: better-sqlite3 ships a prebuilt binary for each (npmRebuild is off).
            args: --mac dmg --arm64 --x64
            cache: |
              ~/Library/Caches/electron
              ~/Library/Caches/electron-builder
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4; version comes from "packageManager" in package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/cache@v4
        with:
          path: ${{ matrix.cache }}
          key: electron-${{ matrix.name }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: electron-${{ matrix.name }}-
      - run: pnpm install --frozen-lockfile
      # electron-builder's fpm calls rpmbuild for the rpm target; the Ubuntu runner does not have it.
      - name: Install rpm tooling
        if: matrix.name == 'linux'
        run: sudo apt-get update && sudo apt-get install -y rpm
      - name: Build
        run: pnpm --filter @matane-anime/desktop build
      - name: Package (and publish when releasing)
        working-directory: apps/desktop
        run: pnpm exec electron-builder ${{ matrix.args }} --publish ${{ needs.prepare.outputs.publish == 'true' && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EP_PRE_RELEASE: ${{ needs.prepare.outputs.prerelease }}
          # Unsigned builds for now (docs/PRD.md R13): do not go looking for a certificate in the keychain.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # Runs after the upload, but the release is still a draft: a red job keeps it from ever going public.
      # Ubuntu 24.04 runners restrict unprivileged user namespaces (AppArmor), which Chromium's sandbox needs.
      - name: Allow user namespaces for the Chromium sandbox
        if: matrix.name == 'linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Smoke test the AppImage
        if: matrix.name == 'linux'
        working-directory: apps/desktop
        run: xvfb-run -a pnpm smoke:packaged
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1' # the runners have no FUSE
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.name }}
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.rpm
            apps/desktop/release/*.exe
            apps/desktop/release/*.dmg
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest*.yml
          if-no-files-found: error
          retention-days: 14

  # The release becomes visible to electron-updater only here, when every build and the smoke test passed.
  publish:
    name: publish the release
    needs: [prepare, build]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Make the release public
        run: gh release edit "$TAG" --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
